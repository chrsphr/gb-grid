# docker-compose's nginx for the web UI. The NixOS module configures the
# equivalent through services.nginx (see nix/module.nix).
server {
	listen 8080;
	root /usr/share/nginx/html;

	# The build ships .gz alongside each asset; API responses are compressed here.
	gzip_static on;
	gzip on;
	gzip_types application/json text/css application/javascript;
	gzip_min_length 1024;

	location /api/ {
		proxy_pass http://postgrest:3000/;
		proxy_set_header Host $host;
	}

	location /_app/immutable/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# Client-side routes all load the single-page app.
	location / {
		try_files $uri /200.html;
	}
}
