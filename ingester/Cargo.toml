[package]
name = "gb-grid-ingest"
version = "0.1.0"
edition = "2021"
description = "Rust ingester for the GB grid BMRS data pipeline"
license = "MIT"

[lib]
name = "gb_grid_ingest"
path = "src/lib.rs"

[[bin]]
name = "gb-grid-ingest"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
csv = "1.3"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "signal"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
wiremock = "0.6"

[profile.release]
lto = true