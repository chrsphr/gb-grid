apiVersion: 1

# Datasource for the docker-compose stack. Points at the `db` service rather
# than a local unix socket; the password comes from $GBGRID_DB_PASSWORD, set by
# docker-compose. uid must stay `gbgrid` — the dashboards reference it.
datasources:
  - name: gb-grid
    type: postgres
    uid: gbgrid
    access: proxy
    url: db:5432
    user: gb_grid
    isDefault: true
    jsonData:
      database: gb_grid
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
    secureJsonData:
      password: $GBGRID_DB_PASSWORD
