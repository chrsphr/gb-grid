[project]
name = "gb-grid"
version = "0.1.0"
description = "GB power grid energy database fed by the Elexon BMRS Insights API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tenacity>=9.0",
    "psycopg[binary,pool]>=3.2",
    "psycopg2>=2.9",
    "yoyo-migrations>=8.2",
    "pydantic>=2.8",
    "typer>=0.12",
    "structlog>=24.4",
    "python-dateutil>=2.9",
]

[project.scripts]
gb-grid = "gb_grid.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-httpx>=0.32",
    "ruff>=0.6",
    "pandas>=2.2",
]
notebook = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "pandas>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gb_grid"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
